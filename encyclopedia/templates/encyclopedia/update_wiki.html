{% extends "encyclopedia/layout.html" %}

{% block title %}
Update Wiki
{% endblock %}

{% block body %}
<form action="" method="post">
    {% csrf_token %}
    {{ form }}

    {% if error %}
    <p class="text-danger">ERROR: {{ error }}</p>
    {% endif %}

    <input type="submit" value="Update" class="btn btn-primary">
</form>
{% endblock %}
